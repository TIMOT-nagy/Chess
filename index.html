<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baráti Online Sakk (0 Ft)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e24;
      color: #f4f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .panel {
      background: #2b2b36;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #43a047; }
    #status { font-weight: bold; font-size: 17px; margin-bottom: 6px; }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(90vw, 480px);
      height: min(90vw, 480px);
      border: 4px solid #3c3c4a;
      border-radius: 6px;
      overflow: hidden;
      user-select: none;
    }
    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 7vw, 44px);
      line-height: 1;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .light { background: #eeeed2; }
    .dark { background: #769656; }
    .selected { background: #f6f669 !important; }
    .hint::after {
      content: "";
      width: 28%;
      height: 28%;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      position: absolute;
    }
    .piece-w {
      color: #ffffff;
      -webkit-text-stroke: 1.5px #18181b;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.45);
    }
    .piece-b {
      color: #18181b;
    }
  </style>
</head>
<body>

  <div class="panel">
    <div id="status">Kapcsolódás a hálózathoz...</div>
    <div id="substatus" style="font-size: 14px; color: #bbb;"></div>
    <button id="copyBtn">Meghívó link másolása</button>
  </div>

  <div id="board"></div>

  <script type="module">
    import { Chess } from 'https://esm.sh/chess.js@1.0.0-beta.8';
    import { joinRoom, selfId } from 'https://esm.sh/trystero@0.20.0/nostr';

    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('szoba');
    if (!roomId) {
      roomId = Math.random().toString(36).substring(2, 8);
      window.history.replaceState({}, '', `?szoba=${roomId}`);
    }

    document.getElementById('copyBtn').onclick = () => {
      navigator.clipboard.writeText(window.location.href);
      alert('Link vágólapra másolva! Küldd el a barátodnak.');
    };

    const game = new Chess();
    const room = joinRoom({ appId: 'barati-sakk-0ft-v1' }, roomId);
    const [sendMove, getMove] = room.makeAction('move');

    let myColor = null;
    let selectedSquare = null;
    let opponentJoined = false;

    const statusEl = document.getElementById('status');
    const substatusEl = document.getElementById('substatus');
    const boardEl = document.getElementById('board');

    // Mindkét színhez a telt bábukat használjuk, a színt és körvonalat a CSS adja
    const PIECES = {
      w: { k: '♚\uFE0E', q: '♛\uFE0E', r: '♜\uFE0E', b: '♝\uFE0E', n: '♞\uFE0E', p: '♟\uFE0E' },
      b: { k: '♚\uFE0E', q: '♛\uFE0E', r: '♜\uFE0E', b: '♝\uFE0E', n: '♞\uFE0E', p: '♟\uFE0E' }
    };

    statusEl.textContent = 'Várakozás a barátodra...';
    substatusEl.textContent = `Szobakód: ${roomId}`;

    room.onPeerJoin((peerId) => {
      if (opponentJoined) return;
      opponentJoined = true;

      myColor = selfId < peerId ? 'w' : 'b';
      game.reset();
      selectedSquare = null;

      substatusEl.textContent = myColor === 'w' ? 'Te vagy a VILÁGOS' : 'Te vagy a SÖTÉT';
      updateStatus();
      renderBoard();
    });

    room.onPeerLeave(() => {
      opponentJoined = false;
      statusEl.textContent = 'Az ellenfél kilépett.';
    });

    getMove((move) => {
      game.move(move);
      selectedSquare = null;
      updateStatus();
      renderBoard();
    });

    function handleSquareClick(square) {
      if (!opponentJoined || game.isGameOver()) return;
      if (game.turn() !== myColor) return;

      if (selectedSquare) {
        try {
          const moveData = { from: selectedSquare, to: square, promotion: 'q' };
          game.move(moveData);
          
          selectedSquare = null;
          sendMove(moveData);
          updateStatus();
          renderBoard();
          return;
        } catch (e) {}
      }

      const piece = game.get(square);
      if (piece && piece.color === myColor) {
        selectedSquare = square;
      } else {
        selectedSquare = null;
      }
      renderBoard();
    }

    function updateStatus() {
      if (game.isCheckmate()) {
        statusEl.textContent = game.turn() === myColor ? 'Matt! Vesztettél.' : 'Sakk-matt! Nyertél!';
      } else if (game.isDraw()) {
        statusEl.textContent = 'Döntetlen!';
      } else {
        const turnText = game.turn() === myColor ? 'Te következel!' : 'Az ellenfél lép...';
        const checkText = game.isCheck() ? ' (SAKK!)' : '';
        statusEl.textContent = turnText + checkText;
      }
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      const boardState = game.board();
      
      const legalTargets = selectedSquare
        ? game.moves({ square: selectedSquare, verbose: true }).map(m => m.to)
        : [];
